<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews - WARYAM MART</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .reviews-section {
            min-height: 100vh;
            padding: 60px 20px;
        }

        .reviews-section > h2 {
            text-align: center;
            font-size: 35px;
            margin-bottom: 30px;
        }

        .review-form {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin: 0 auto 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .review-form h3 {
            margin-bottom: 20px;
        }

        .review-form input,
        .review-form select,
        .review-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .review-form textarea {
            height: 100px;
            resize: none;
        }

        .review-form button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #ffc107;
            color: #222;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .review-form button:hover {
            background: #e0a800;
        }

        #reviewsList {
            max-width: 600px;
            margin: auto;
        }

        .review-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .review-card h3 {
            margin-bottom: 8px;
        }

        .stars {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .review-card p {
            color: #555;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: #027a5c;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0056b3;
        }

    </style>

</head>

<body>


<section class="reviews-section">

    <h2>⭐ Customer Reviews</h2>

    <div class="review-form">

        <h3>Write a Review</h3>

        <input
            type="text"
            id="reviewName"
            placeholder="Your name"
        >

        <select id="reviewRating">

            <option value="5">
                ⭐⭐⭐⭐⭐ 5 Stars
            </option>

            <option value="4">
                ⭐⭐⭐⭐ 4 Stars
            </option>

            <option value="3">
                ⭐⭐⭐ 3 Stars
            </option>

            <option value="2">
                ⭐⭐ 2 Stars
            </option>

            <option value="1">
                ⭐ 1 Star
            </option>

        </select>

        <textarea
            id="reviewText"
            placeholder="Write your review..."
        ></textarea>

        <button onclick="addReview()">
            Submit Review ⭐
        </button>

    </div>


    <div id="reviewsList">

        <div class="review-card">

            <h3>Ali</h3>

            <div class="stars">
                ⭐⭐⭐⭐⭐
            </div>

            <p>
                Amazing product! I really like it.
            </p>

        </div>

    </div>


    <a href="practice.html" class="back-btn">
        ← Back to Home
    </a>

</section>


<script>

function addReview() {

    let name =
        document.getElementById("reviewName").value;

    let rating =
        document.getElementById("reviewRating").value;

    let text =
        document.getElementById("reviewText").value;


    if (name === "" || text === "") {

        alert("Please enter your name and review!");

        return;

    }


    let stars = "";

    for (let i = 0; i < Number(rating); i++) {

        stars += "⭐";

    }


    let reviewsList =
        document.getElementById("reviewsList");


    reviewsList.innerHTML += `

        <div class="review-card">

            <h3>${name}</h3>

            <div class="stars">
                ${stars}
            </div>

            <p>
                ${text}
            </p>

        </div>

    `;


    document.getElementById("reviewName").value = "";

    document.getElementById("reviewText").value = "";

    document.getElementById("reviewRating").value = "5";


    alert("⭐ Review submitted successfully!");

}

</script>

</body>

</html>
