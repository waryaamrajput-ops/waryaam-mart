<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - WARYAM MART</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .checkout-section {
            min-height: 100vh;
            padding: 60px 20px;
        }

        .checkout-section h2 {
            text-align: center;
            font-size: 35px;
            margin-bottom: 30px;
        }

        .checkout-box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .checkout-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .checkout-box input,
        .checkout-box textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .checkout-box textarea {
            height: 100px;
            resize: none;
        }

        #checkoutTotal {
            margin-top: 20px;
            font-size: 22px;
        }

        .place-order-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #198754;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .place-order-btn:hover {
            background: #146c43;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0056b3;
        }

    </style>
</head>

<body>

<section class="checkout-section">

    <h2>💳 Checkout</h2>

    <div class="checkout-box">

        <label>Full Name</label>
        <input type="text" id="customerName" placeholder="Enter your name">

        <label>Phone Number</label>
        <input type="text" id="customerPhone" placeholder="Enter phone number">

        <label>Address</label>
        <textarea id="customerAddress" placeholder="Enter your address"></textarea>

        <h3 id="checkoutTotal">Total: Rs 0</h3>

        <button onclick="placeOrder()" class="place-order-btn">
            ✅ Place Order
        </button>

    </div>

    <a href="practice.html" class="back-btn">
        ← Back to Home
    </a>

</section>


<script>

function placeOrder() {

    let name = document.getElementById("customerName").value;
    let phone = document.getElementById("customerPhone").value;
    let address = document.getElementById("customerAddress").value;

    if (name === "" || phone === "" || address === "") {

        alert("Please fill all the details!");

        return;
    }

    alert(
        "🎉 Order Placed Successfully!\n\n" +
        "Thank you, " + name + " ❤️"
    );

    document.getElementById("customerName").value = "";
    document.getElementById("customerPhone").value = "";
    document.getElementById("customerAddress").value = "";

}

</script>

</body>

</html>
