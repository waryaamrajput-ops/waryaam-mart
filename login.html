<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - WARYAM MART</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-box {
            width: 400px;
            max-width: 100%;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.15);

            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff0000;

            margin-bottom: 10px;
        }

        .login-box h2 {
            margin-bottom: 25px;
            color: #720912;
        }

        .login-box input {
            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .login-box input:focus {
            border-color: #0b8d21;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background:#02a070e3;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #02a070e3;
        }

        .signup-text {
            margin-top: 20px;
            color: #666;
        }

        .signup-text button {
            border: none;
            background: none;

            color: #005e17;

            font-weight: bold;

            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;

            margin-top: 20px;

            color: #025817;

            text-decoration: none;

            font-size: 14px;
        }

        .back-btn:hover {
            color: #016801;
        }

    </style>

</head>


<body>

    <section class="login-page">

        <div class="login-box">

           

            <h2 id="formTitle">
                Login
            </h2>


            <!-- Login / Signup Form -->

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                style="display: none;"
            >

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button
                class="login-btn"
                onclick="submitForm()"
                id="submitButton"
            >
                Login
            </button>


            <p class="signup-text">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button onclick="switchForm()">
                    <span id="switchButton">
                        Sign Up
                    </span>
                </button>

            </p>


            <p id="message"></p>


            <a href="practice.html" class="back-btn">
                ← Back to Home
            </a>

        </div>

    </section>


    <script>

        let isSignup = false;


        function switchForm() {

            isSignup = !isSignup;

            let name =
                document.getElementById("name");

            let title =
                document.getElementById("formTitle");

            let button =
                document.getElementById("submitButton");

            let switchText =
                document.getElementById("switchText");

            let switchButton =
                document.getElementById("switchButton");


            document.getElementById("message").innerText = "";


            if (isSignup) {

                title.innerText = "Sign Up";

                name.style.display = "block";

                button.innerText = "Create Account";

                switchText.innerText =
                    "Already have an account?";

                switchButton.innerText =
                    "Login";

            } else {

                title.innerText = "Login";

                name.style.display = "none";

                button.innerText = "Login";

                switchText.innerText =
                    "Don't have an account?";

                switchButton.innerText =
                    "Sign Up";

            }

        }


        function submitForm() {

            let name =
                document.getElementById("name").value;

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;

            let message =
                document.getElementById("message");


            if (isSignup && name === "") {

                message.innerText =
                    "❌ Please enter your name.";

                message.style.color = "red";

                return;
            }


            if (email === "" || password === "") {

                message.innerText =
                    "❌ Please fill all fields.";

                message.style.color = "red";

                return;
            }


            if (password.length < 6) {

                message.innerText =
                    "❌ Password must be at least 6 characters.";

                message.style.color = "red";

                return;
            }


            if (isSignup) {

                message.innerText =
                    "✅ Account created successfully!";

            } else {

                message.innerText =
                    "✅ Login successful!";

            }


            message.style.color = "green";

        }

    </script>

</body>

</html>
